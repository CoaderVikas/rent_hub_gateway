#server port configuration
server:
  port: 9096

#application name configuration
spring:
  application:
    name: RENT-HUB-GATEWAY
  profiles:
    active: local

  cloud:
    gateway:
      routes:
        - id: AUTH-SERVICE
          uri: http://localhost:9091
          predicates:
            - Path=/rent-hub/auth/**
          filters:
            - AuthenticationFilter


        - id: PROPERTY-IMAGES
          uri: http://localhost:9090
          predicates:
            - Path=/uploads/properties/**

        - id: NOTIFICATION-WS
          uri: ws://localhost:9092
          predicates:
            - Path=/rent-hub/ws/**
          filters:
            - StripPrefix=1

        - id: WEB-BFF
          uri: http://localhost:9095
          predicates:
            - Path=/rent-hub/api/v1/**
          filters:
            - AuthenticationFilter

#health configuration
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always


# ==========================================================
# JWT CONFIGURATION:JWT secret key (from environment variable)
# ==========================================================
jwt:
  secret: ${JWT_SECRET}


# ==========================================================
# CORS CONFIGURATION : Comma-separated allowed origins (from env variable)
# ==========================================================
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
