# ==========================================================
# SERVER CONFIGURATION : Application port
# ==========================================================
server:
  port: ${PORT:9096}

# ==========================================================
# SPRING APPLICATION CONFIGURATION : Service name (registered in Eureka)
# ==========================================================
spring:
  application:
    name: RENT-HUB-GATEWAY

  # ----------------------------------------------------------
  # Spring Cloud Gateway - Route Definitions
  # ----------------------------------------------------------
  cloud:
    gateway:
      routes:

#********** Auth-SERVICE rounting **************#
        - id: AUTH-SERVICE
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/rent-hub/api/v1/auth/**
          filters:
            - AuthenticationFilter

#********** TENANTS-SERVICE rounting **************#
        - id: TENANTS-SERVICE
          uri: lb://TENANTS-SERVICE
          predicates:
            - Path=/rent-hub/api/v1/tenants/**
          filters:
            - AuthenticationFilter

#********** PROPERTY-SERVICE rounting **************#
        - id: PROPERTY-SERVICE
          uri: lb://PROPERTY-SERVICE
          predicates:
            - Path=/rent-hub/api/v1/properties/**
          filters:
            - AuthenticationFilter

#********** AGREEMENT-SERVICE rounting **************#
        - id: AGREEMENT-SERVICE
          uri: lb://AGREEMENT-SERVICE
          predicates:
            - Path=/rent-hub/api/v1/agreement/**
          filters:
            - AuthenticationFilter

#********** PAYMENT-SERVICE rounting **************#
        - id: PAYMENT-SERVICE
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/rent-hub/api/v1/payment/**
          filters:
            - AuthenticationFilter

#********** NOTIFICATION-SERVICE rounting **************#
        - id: NOTIFICATION-SERVICE
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/rent-hub/api/v1/notifications/**
          filters:
            - AuthenticationFilter



        # Web BFF (Backend for Frontend) Routes
        - id: WEB-BFF
          uri: lb://WEB-BFF
          predicates:
            - Path=/rent-hub/api/v1/**
          filters:
            - AuthenticationFilter

        # Property Images Routes (Static/Uploaded Files)
        - id: PROPERTY-IMAGES
          uri: lb://PROPERTY-SERVICE
          predicates:
            - Path=/uploads/properties/**

        # Notification Service - WebSocket Routes
        - id: NOTIFICATION-WS
          uri: lb:wss://NOTIFICATION-SERVICE
          predicates:
            - Path=/rent-hub/ws/**
          filters:
            - StripPrefix=1                              # Strips first path segment before forwarding

#********** MODULER-MONOLITH SERVICE rounting **************#

        - id: RENT-HUB-SERVICE
          uri: lb://RENT-HUB-SERVICE
          predicates:
            - Path=/rent-hub/api/v2/**
          filters:
            - AuthenticationFilter

        - id: NOTIFICATION-WS-SERVICE
          uri: wss://RENT-HUB-SERVICE
          predicates:
            - Path=/rent-hub/web-socket/**
          filters:
            - StripPrefix=1

# ==========================================================
# EUREKA CLIENT CONFIGURATION
# ==========================================================
eureka:
  client:
    register-with-eureka: true                           # Register this service with Eureka
    fetch-registry: true                                 # Fetch registry info from Eureka
    service-url:
      defaultZone: https://eureca-server-e09m.onrender.com/eureka   # Eureka server URL
  instance:
    prefer-ip-address: true                               # Use IP address instead of hostname

# ==========================================================
# ACTUATOR / MANAGEMENT ENDPOINTS CONFIGURATION,
#            Expose all actuator endpoints
# ==========================================================
management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always                                # Always show full health details


# ==========================================================
# JWT CONFIGURATION:JWT secret key (from environment variable)
# ==========================================================
jwt:
  secret: ${JWT_SECRET}


# ==========================================================
# CORS CONFIGURATION : Comma-separated allowed origins (from env variable)
# ==========================================================
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}